name: CI

# Runs on every push and pull request targeting development or main,
# so problems get caught both while working and right before a merge.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # npm ci installs exactly what's in package-lock.json — faster and
      # more reliable for CI than npm install, which can drift versions.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Catches build-breaking errors that lint/tests might miss.
      - name: Build
        run: npm run build