# CI (Continuous Integration) workflow for this project.
# Automatically checks every push and pull request so broken code
# can't land on development or main without being noticed.
name: CI

# When this workflow runs:
# - on every push to development or main
# - on every pull request targeting development or main
# This means a PR gets checked before it's even merged, and the
# target branch gets checked again right after the merge happens.
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

# CI only needs to read the code, so the workflow gets read-only access.
permissions:
  contents: read

# If a new commit is pushed to the same branch or PR while a run is still
# going, the older run is cancelled. Saves minutes and avoids confusing
# results from outdated code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FRONTEND: installs, lints, tests, and builds the React app, in that
  # order — cheapest/fastest checks first, so a bad PR fails quickly
  # instead of waiting through a full test run first.
  # (The job id stays "build-and-test" so any branch protection rule that
  # requires this check keeps working.)
  build-and-test:
    runs-on: ubuntu-latest

    # The React app lives in client/, so every "run:" step below
    # executes inside that folder. (This setting does not affect
    # "uses:" steps such as checkout and setup-node.)
    defaults:
      run:
        working-directory: client

    steps:
      # Pulls this repo's code onto the runner. Every workflow needs
      # this as its first step — nothing else can run without it.
      - name: Check out the repo
        uses: actions/checkout@v4

      # Installs Node.js on the runner. Version 22 matches what the
      # project's dependencies (React 19, Vite 8, ESLint 10) expect.
      # cache: 'npm' speeds up future runs by reusing downloaded
      # packages instead of fetching them from scratch every time.
      # cache-dependency-path tells it where package-lock.json is,
      # since it lives inside client/.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # npm ci (not npm install) installs exactly what's locked in
      # package-lock.json and fails if it's out of sync with
      # package.json. This guarantees the same dependency versions
      # every single run, which matters for CI reliability.
      - name: Install dependencies
        run: npm ci

      # Runs ESLint via the project's own "lint" script, using the
      # same config everyone runs locally — so a pass here means a
      # pass on any teammate's machine too.
      - name: Lint
        run: npm run lint

      # Runs the Vitest suite via the project's "test" script.
      - name: Run tests
        run: npm test

      # Confirms the app actually builds for production. This catches
      # issues lint and tests might miss, like a broken import that
      # only fails at build time. The build also generates the PWA
      # manifest and service worker.
      - name: Build
        run: npm run build

  # BACKEND: installs the Flask API's dependencies and runs the pytest
  # suite. It runs in parallel with the frontend job, so neither one
  # waits for the other. The tests use an in-memory SQLite database
  # (TestConfig), so no PostgreSQL service or secrets are needed here.
  backend-tests:
    runs-on: ubuntu-latest

    # All backend commands run inside server/ (pytest.ini lives there and
    # makes `models`, `routes` and the other folders importable).
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Python 3.14 matches [requires] in server/Pipfile.
      # cache: 'pip' reuses downloaded packages between runs, keyed on
      # requirements.txt.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      # requirements.txt is the same file Render installs from, so this
      # tests the exact versions that get deployed. It holds only the
      # runtime packages, so the two test tools (the Pipfile's
      # [dev-packages]) are added on the next line.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      # Runs every test in server/tests/ (auth, models, categories,
      # questions, admin routes, quiz attempts, seed data, external API).
      - name: Run tests
        run: python -m pytest -v

      # The offline question pack (client/src/data/offlineQuestions.json) is
      # generated from server/utils/seed_data.py. This fails if someone edits
      # the seed questions but forgets to regenerate the pack, which would
      # leave offline players with different questions than online ones.
      # To fix a failure, run from server/:
      #   pipenv run python -m utils.export_offline_pack
      # and commit the updated JSON file.
      - name: Check the offline question pack is up to date
        run: python -m utils.export_offline_pack --check